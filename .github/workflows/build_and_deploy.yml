name: Build & Deploy Machine Learning for Business Site

on:
  push:
    branches:
      - main
    paths:
      - 'notebooks/**'
      - 'forced_jupyterlite_button.py'
      - 'build_site.py'
      - 'README.md'
      - '.github/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install jupyter-book==0.15.1
          pip install jupyterlite-core==0.2.3 jupyterlite-pyodide-kernel==0.2.3
          pip install -r requirements.txt || echo "No requirements.txt"

      - name: Clean and prepare docs directory
        run: |
          rm -rf docs/*
          mkdir -p docs/jupyterlite

      - name: Build JupyterBook
        run: jupyter-book build notebooks/

      - name: Copy Book HTML into docs
        run: |
          cp -r notebooks/_build/html/* docs/
          echo "Files copied to docs:"
          ls -la docs/

      - name: Run forced JupyterLite button script
        run: |
          python3 forced_jupyterlite_button.py
          echo "After running forced JupyterLite script:"
          ls -la docs/

      - name: Build JupyterLite
        run: |
          echo "=== Building JupyterLite ==="
          mkdir -p jupyterlite_build
          cd jupyterlite_build
          
          # Copy notebooks to build directory
          echo "Copying notebooks..."
          cp -r ../notebooks/*.ipynb . || echo "No .ipynb files found in notebooks/"
          ls -la *.ipynb || echo "No .ipynb files found in jupyterlite_build/"
          
          # Create JupyterLite configuration with dynamic file list
          echo "Generating JupyterLite config..."
          echo '{
            "LiteBuildConfig": {
              "federated_extensions": [
                {
                  "extension": "@jupyterlite/pyodide-kernel-extension",
                  "version": "0.2.3"
                }
              ],
              "output_dir": "_output",
              "files": [' > jupyterlite_config.json
          # Dynamically append all .ipynb files to the files array
          find ../notebooks -maxdepth 1 -name "*.ipynb" -exec basename {} \; | sed 's/.*/"&",/' | sed '$ s/,$//' >> jupyterlite_config.json
          echo ']
            }
          }' >> jupyterlite_config.json
          
          # Verify config file
          echo "JupyterLite config:"
          cat jupyterlite_config.json
          
          # Build JupyterLite with config
          echo "Building JupyterLite..."
          jupyter lite build --config jupyterlite_config.json --debug
          
          echo "JupyterLite build completed. Checking output..."
          ls -la _output/
          
          # Check if files directory was created
          echo "Looking for files in JupyterLite output:"
          find _output/ -name "*.ipynb" -type f
          ls -la _output/files/ || echo "No files directory in _output"
          
          # Copy to final destination
          echo "Copying JupyterLite to docs..."
          mkdir -p ../docs/jupyterlite
          cp -r _output/* ../docs/jupyterlite/
          
          cd ..
          rm -rf jupyterlite_build
          
          echo "=== Final JupyterLite structure ==="
          ls -la docs/jupyterlite/
          echo "=== Looking for notebooks in final location ==="
          find docs/jupyterlite/ -name "*.ipynb" -type f
          echo "=== Files directory check ==="
          ls -la docs/jupyterlite/files/ || echo "Still no files directory"

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4