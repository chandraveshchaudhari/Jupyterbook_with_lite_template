name: Build and Deploy Jupyter Book Site

on:
  push:
    branches:
      - main
    paths:
      - 'notebooks/**'
      - 'extensions/forced_jupyterlite_button.py'
      - 'extensions/markdown_code_to_pyodide.py'
      - 'extensions/auto_notebook_creation_using_toc.py'
      - 'build_site.py'
      - 'requirements.txt'
      - 'README.md'
      - '.github/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install dependencies
        run: |
          pip install -r requirements.txt

  
      - name: Update repository metadata for current fork
        run: |
          python - <<'PY'
          import os
          import yaml

          repo = os.environ.get("GITHUB_REPOSITORY", "")
          if not repo:
              raise SystemExit("GITHUB_REPOSITORY not available")

          with open("notebooks/_config.yml", "r", encoding="utf-8") as f:
              cfg = yaml.safe_load(f)

          repo_cfg = cfg.get("repository", {})
          repo_cfg["url"] = f"https://github.com/{repo}"
          repo_cfg["branch"] = "main"
          repo_cfg["path_to_book"] = "notebooks"
          cfg["repository"] = repo_cfg

          with open("notebooks/_config.yml", "w", encoding="utf-8") as f:
              yaml.safe_dump(cfg, f, sort_keys=False, allow_unicode=False)

          print(f"Configured repository.url for {repo}")
          PY

      - name: Clean and prepare docs directory
        run: |
          rm -rf docs/*
          mkdir -p docs/jupyterlite
          touch docs/.nojekyll
          echo "Created .nojekyll in docs/"

      - name: Build JupyterBook
        run: jupyter-book build notebooks/

      - name: Copy Book HTML into docs
        run: |
          cp -r notebooks/_build/html/* docs/
          echo "Files copied to docs:"
          ls -la docs/

      - name: Run forced JupyterLite button script
        run: |
          python3 extensions/forced_jupyterlite_button.py
          echo "After running forced JupyterLite script:"
          ls -la docs/
          grep -r "jupyterlite/lab/index.html?path=" docs/ || echo "No notebook URLs found"

      - name: Build JupyterLite
        run: |
          echo "=== Building JupyterLite ==="
          mkdir -p jupyterlite_things/files
          cp -r notebooks/*.ipynb jupyterlite_things/files/ || echo "No .ipynb files found in notebooks/"
          cd jupyterlite_things
          
          echo "Generating jupyter-lite.json..."
          echo '{
            "jupyter-config-data": {
              "appName": "JupyterLite",
              "appUrl": "./lab",
              "appVersion": "0.7.4",
              "baseUrl": "./",
              "defaultKernelName": "python"
            },
            "jupyter-lite-schema-version": 0
          }' > jupyter-lite.json

          jupyter lite build --debug

          mkdir -p ../docs/jupyterlite
          cp -r _output/* ../docs/jupyterlite/

          cd ..
          rm -rf jupyterlite_things

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
