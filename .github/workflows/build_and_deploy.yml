name: Build & Deploy jupyterbooklite Site

on:
  push:
    branches:
      - main
    paths:
      - 'notebooks/**'
      - 'forced_jupyterlite_button.py'
      - 'build_site.py'
      - 'README.md'
      - '.github/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          # If you have a requirements.txt, include it; else install needed tools
          pip install jupyter-book
          pip install jupyterlite-core jupyterlite-pyodide-kernel
          pip install -r requirements.txt || echo "No requirements.txt"

      - name: Clean and prepare docs directory
        run: |
          # Remove existing docs content but keep the folder structure
          rm -rf docs/*
          # Create jupyterlite subdirectory
          mkdir -p docs/jupyterlite

      - name: Build JupyterBook
        run: jupyter-book build notebooks/

      - name: Run forced JupyterLite button script (on built HTML)
        run: |
          python3 forced_jupyterlite_button.py
          echo "JupyterLite buttons added to built HTML"

      - name: Copy Book HTML into docs
        run: |
          cp -r notebooks/_build/html/* docs/
          echo "Files copied to docs:"
          ls -la docs/

      - name: Build JupyterLite
        run: |
          echo "=== Building JupyterLite ==="
          mkdir -p jupyterlite_things/content
          echo "Available notebooks:"
          ls -la notebooks/*.ipynb
          # Copy notebooks to content directory for JupyterLite
          cp notebooks/*.ipynb jupyterlite_things/content/
          # Copy config if it exists
          cp jupyter-lite.json jupyterlite_things/ || echo "No jupyter-lite.json config found"
          echo "Copied files to jupyterlite_things:"
          ls -la jupyterlite_things/
          ls -la jupyterlite_things/content/
          cd jupyterlite_things
          echo "Running jupyter lite build..."
          jupyter lite build --debug
          echo "JupyterLite build output:"
          ls -la _output/
          echo "Contents of _output/:"
          find _output/ -type f | head -20
          echo "Files directory in _output:"
          ls -la _output/files/ || echo "No files directory found"
          echo "Creating docs/jupyterlite directory..."
          mkdir -p ../docs/jupyterlite
          cp -r _output/* ../docs/jupyterlite/
          cd ..
          rm -rf jupyterlite_things
          echo "=== JupyterLite files in docs/jupyterlite: ==="
          ls -la docs/jupyterlite/
          echo "=== Files in docs/jupyterlite/files: ==="
          ls -la docs/jupyterlite/files/ || echo "files directory not found"
          echo "=== Complete docs structure: ==="
          find docs/ -name "*.ipynb" | head -10

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4